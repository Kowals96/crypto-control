name: sim-data fetch
on:
  push:
    branches: [sim-data]
    paths: [fetch.js, .github/workflows/fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node fetch.js
      - run: |
          git config user.name "sim-data bot"; git config user.email "noreply@github.com"
          git add package-lock.json package.json && git commit -m "dane 1h" && git push
